name: Validate project baseline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local validations (no GCP credentials)
        run: bash scripts/verify-local.sh
